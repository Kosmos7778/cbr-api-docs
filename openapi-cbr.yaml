# OpenAPI 3.1 спецификация: официальные курсы валют ЦБ РФ
# Портфолио-пример технического писателя. Данные и эндпоинты проверены вживую
# 05.11.2026 на сервисе cbr-xml-daily.ru (зеркало данных Банка России).
# Проверка валидности: npx @redocly/cli lint openapi-cbr.yaml
openapi: 3.1.0
info:
  title: Курсы валют ЦБ РФ
  version: 1.0.0
  summary: Официальные курсы валют Банка России в JSON
  description: |
    Неофициальное JSON-зеркало [данных Банка России](https://www.cbr.ru/) на базе сервиса
    **cbr-xml-daily.ru**. Сервис отдаёт те же котировки, что публикует ЦБ РФ, но в удобном
    JSON вместо XML с кодировкой 1251.

    **Когда обновляются данные.** Котировки устанавливаются Банком России один раз в рабочий
    день; файл `daily_json.js` обновляется сразу после установки. Поля `Date` и `Timestamp`
    в ответе показывают точное время котировок.

    **Что удобно проверять без ключа.** Аутентификация не требуется, лимиты отсутствуют —
    API подходит для расчётов в личном кабинете, отчётности и учебных проектов.

    **Номинал важен.** Значения `Value`/`Previous` — рублей за `Nominal` единиц валюты.
    У йены `Nominal = 100`, у вон — `1000`: делите на номинал, если нужен курс за единицу.
  contact:
    name: Источник данных cbr-xml-daily.ru
    url: https://www.cbr-xml-daily.ru/
  license:
    name: Данные ЦБ РФ — публичная информация
    url: https://www.cbr.ru/
externalDocs:
  description: Полная документация сервиса (XML, JSONP, money.js)
  url: https://www.cbr-xml-daily.ru/
servers:
  - url: https://www.cbr-xml-daily.ru
    description: Продакшен
tags:
  - name: Курсы
    description: Текущие и архивные котировки
  - name: Конвертация
    description: Формат для библиотек конвертации валют
paths:
  /daily_json.js:
    get:
      tags: [Курсы]
      operationId: getLatestRates
      summary: Актуальные курсы на последний торговый день
      description: |
        Возвращает котировки последнего установленного дня. Поле `Valute` — словарь,
        ключ которого — буквенный код валюты (ISO 4217): `USD`, `EUR`, `CNY` и ещё ~45 позиций.
        В `Previous` лежит курс предыдущего дня — удобно считать изменение без второго запроса.
      responses:
        '200':
          description: Котировки последнего торгового дня
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRates'
              examples:
                usd:
                  summary: Фрагмент реального ответа (доллар и евро)
                  value:
                    Date: "2026-11-04T11:30:00+03:00"
                    PreviousDate: "2026-11-03T11:30:00+03:00"
                    PreviousURL: "//www.cbr-xml-daily.ru/archive/2026/11/03/daily_json.js"
                    Timestamp: "2026-11-04T20:00:00+03:00"
                    Valute:
                      USD:
                        ID: R01235
                        NumCode: "840"
                        CharCode: USD
                        Nominal: 1
                        Name: Доллар США
                        Value: 81.6699
                        Previous: 80.9734
                      EUR:
                        ID: R01239
                        NumCode: "978"
                        CharCode: EUR
                        Nominal: 1
                        Name: Евро
                        Value: 91.601
                        Previous: 90.4635
        '500':
          $ref: '#/components/responses/ServerError'
  /archive/{year}/{month}/{day}/daily_json.js:
    get:
      tags: [Курсы]
      operationId: getArchivedRates
      summary: Архив курсов за конкретную дату
      description: |
        Котировки за дату в формате `{ГГГГ}/{ММ}/{ДД}` — месяц и день с ведущим нулём.
        Ответ имеет ту же структуру, что и актуальный, поэтому один парсер обслуживает
        оба сценария. Архивные даты удобно брать из поля `PreviousURL` прошлого ответа.
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Day'
      responses:
        '200':
          description: Котировки на запрошенную дату
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRates'
              examples:
                archive:
                  summary: Фрагмент ответа за 30.10.2026
                  value:
                    Date: "2026-10-30T11:30:00+03:00"
                    PreviousDate: "2026-10-29T11:30:00+03:00"
                    Timestamp: "2026-10-30T17:00:00+03:00"
                    Valute:
                      USD:
                        ID: R01235
                        NumCode: "840"
                        CharCode: USD
                        Nominal: 1
                        Name: Доллар США
                        Value: 80.6761
                        Previous: 80.8664
        '404':
          description: Нет данных за дату — выходные, праздник или дата в будущем
          content:
            text/html:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ServerError'
  /latest.js:
    get:
      tags: [Конвертация]
      operationId: getMoneyJsRates
      summary: Курсы в формате money.js
      description: |
        Совместим с библиотекой [money.js](https://openexchangerates.github.io/money.js/):
        `rates` показывает, сколько единиц валюты дают за 1 рубль (обратная котировка).
        С `daily_json.js` это согласуется так: `1 / 81.6699 ≈ 0.0122444` для USD.
        Готовые конвертации — через сервисный скрипт `money.js` с сайта источника.
      responses:
        '200':
          description: Котировки для money.js
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyRates'
              examples:
                moneyjs:
                  summary: Фрагмент реального ответа
                  value:
                    disclaimer: https://www.cbr-xml-daily.ru/#terms
                    date: "2026-11-04"
                    timestamp: 1793750400
                    base: RUB
                    rates:
                      AUD: 0.0175522
                      GBP: 0.009126727
                      USD: 0.0122444
                      EUR: 0.0109169
                      CNY: 0.0820906
        '500':
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    Year:
      name: year
      in: path
      required: true
      description: Год котировок
      schema:
        type: integer
        minimum: 1992
        maximum: 2100
        example: 2026
    Month:
      name: month
      in: path
      required: true
      description: Месяц с ведущим нулём (01–12)
      schema:
        type: integer
        minimum: 1
        maximum: 12
        example: 11
    Day:
      name: day
      in: path
      required: true
      description: День с ведущим нулём (01–31)
      schema:
        type: integer
        minimum: 1
        maximum: 31
        example: 4
  responses:
    ServerError:
      description: Внутренняя ошибка сервиса-зеркала (не ошибка ЦБ РФ)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DailyRates:
      type: object
      title: Котировки за день
      description: Котировки одного дня. Ключи `Valute` — буквенные коды ISO 4217.
      required: [Date, PreviousDate, PreviousURL, Timestamp, Valute]
      properties:
        Date:
          type: string
          format: date-time
          description: Момент установки котировок данного дня
          example: "2026-11-04T11:30:00+03:00"
        PreviousDate:
          type: string
          format: date-time
          description: Момент установки котировок предыдущего дня
          example: "2026-11-03T11:30:00+03:00"
        PreviousURL:
          type: string
          description: Ссылка на архив предыдущего дня — готовый следующий шаг для обхода истории
          example: "//www.cbr-xml-daily.ru/archive/2026/11/03/daily_json.js"
        Timestamp:
          type: string
          format: date-time
          description: Время формирования файла зеркалом
          example: "2026-11-04T20:00:00+03:00"
        Valute:
          type: object
          description: |
            Словарь «код валюты → котировка». В файле ~45–50 позиций: AUD, GBP, USD, EUR,
            CNY, JPY, KZT, TRY, AED и другие. Список стабилен, но новые коды возможны —
            парсер должен не падать на незнакомых ключах.
          additionalProperties:
            $ref: '#/components/schemas/ValuteItem'
    ValuteItem:
      type: object
      title: Котировка одной валюты
      required: [ID, NumCode, CharCode, Nominal, Name, Value, Previous]
      properties:
        ID:
          type: string
          description: Внутренний идентификатор ЦБ РФ (стабилен между днями)
          example: R01235
        NumCode:
          type: string
          description: Цифровой код ISO 4217 как строка — с ведущим нулём
          example: "840"
        CharCode:
          type: string
          description: Буквенный код ISO 4217
          example: USD
        Nominal:
          type: integer
          description: |
            Количество единиц валюты, к которому относится курс. У JPY — 100, у KRW — 1000,
            у USD — 1. Курс за одну единицу: `Value / Nominal`.
          example: 1
        Name:
          type: string
          description: Название валюты на русском
          example: Доллар США
        Value:
          type: number
          format: double
          description: Курс в рублях за Nominal единиц
          example: 81.6699
        Previous:
          type: number
          format: double
          description: Курс предыдущего дня в рублях за Nominal единиц
          example: 80.9734
    MoneyRates:
      type: object
      title: Котировки money.js
      required: [disclaimer, date, timestamp, base, rates]
      properties:
        disclaimer:
          type: string
          format: uri
          description: Ссылка на условия использования данных
          example: https://www.cbr-xml-daily.ru/#terms
        date:
          type: string
          format: date
          example: "2026-11-04"
        timestamp:
          type: integer
          description: Unix-time формирования файла
          example: 1793750400
        base:
          type: string
          description: Базовая валюта — всегда рубль
          example: RUB
        rates:
          type: object
          description: Единиц валюты за 1 рубль (обратная котировка)
          additionalProperties:
            type: number
            format: double
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Internal server error, try later
